name: smart_med_cabinet
description: "A Flutter smart medicine cabinet prototype with OCR, local SQLite search, inventory tracking, and medication safety checks."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  google_mlkit_text_recognition: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
